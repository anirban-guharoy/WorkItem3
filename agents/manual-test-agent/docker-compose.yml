# Local dependencies only. Run the app on the host (npm run dev:local) or point it at this database.
# Credentials are throwaway local values; never reuse them elsewhere.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent_local_only
      POSTGRES_DB: manual_test_agent
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agent -d manual_test_agent']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
