apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "review.name" . }}-config
  labels:
    {{- include "review.labels" . | nindent 4 }}
data:
  PORT: "3001"
  DATA_DIR: /data
  NODE_ENV: production
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "review.serviceAccount" . }}
  labels:
    {{- include "review.labels" . | nindent 4 }}
  {{- if .Values.serviceAccount.clientId }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.serviceAccount.clientId | quote }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
