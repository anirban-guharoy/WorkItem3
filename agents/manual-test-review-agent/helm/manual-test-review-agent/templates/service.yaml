apiVersion: v1
kind: Service
metadata:
  name: {{ include "review.name" . }}
  labels:
    {{- include "review.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "review.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
