# Create the secret from the review agent's environment file:
# kubectl -n manual-test-reviewer create secret generic manual-test-reviewer-secrets \
#   --from-env-file=agents/manual-test-review-agent/.env
apiVersion: v1
kind: Secret
metadata:
  name: manual-test-reviewer-secrets
  namespace: manual-test-reviewer
type: Opaque
stringData:
  AZURE_FOUNDRY_ENDPOINT: https://<resource>.services.ai.azure.com/anthropic
  AZURE_FOUNDRY_API_KEY: ""
  MCP_SERVER_URL: https://mcp.example.com/mcp
  MCP_SERVER_TOKEN: ""
  XRAY_BASE_URL: https://xray.cloud.getxray.app
  XRAY_CLIENT_ID: ""
  XRAY_CLIENT_SECRET: ""
  XRAY_TEST_CYCLE_NAME: Manual Test Review - Regression
  ENTRA_TENANT_ID: ""
  ENTRA_API_AUDIENCE: ""
  DASHBOARD_ORIGIN: https://langsmith-ui.example.com
  LANGSMITH_TRACING: "true"
  LANGSMITH_API_KEY: ""
  LANGSMITH_ENDPOINT: https://api.smith.langchain.com
  LANGSMITH_PROJECT: manual-test-review-agent
