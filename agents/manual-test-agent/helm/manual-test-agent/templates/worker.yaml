apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mta.fullname" . }}-worker
  labels:
    {{- include "mta.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not .Values.worker.keda.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      {{- include "mta.selector" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mta.selector" (dict "root" . "component" "worker") | nindent 8 }}
        azure.workload.identity/use: 'true'
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "mta.fullname" . }}-worker
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Long enough to finish or release the in-flight message; unfinished work is redelivered.
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "mta.selector" (dict "root" . "component" "worker") | nindent 14 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "mta.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ['node', 'dist/worker/main.js']
          ports:
            - { name: health, containerPort: {{ .Values.worker.healthPort }} }
          envFrom:
            {{- include "mta.envFrom" (dict "root" . "component" "worker") | nindent 12 }}
          securityContext:
            {{- include "mta.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          startupProbe:
            httpGet: { path: /health/live, port: health }
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet: { path: /health/live, port: health }
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: health }
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- include "mta.csiMount" . | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        {{- include "mta.csiVolume" (dict "root" . "component" "worker") | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "mta.fullname" . }}-worker
  labels:
    {{- include "mta.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.worker.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "mta.selector" (dict "root" . "component" "worker") | nindent 6 }}
{{- if .Values.worker.keda.enabled }}
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "mta.fullname" . }}-worker-sb
  labels:
    {{- include "mta.labels" . | nindent 4 }}
spec:
  podIdentity:
    provider: azure-workload
    identityId: {{ .Values.workloadIdentity.worker.clientId | quote }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "mta.fullname" . }}-worker
  labels:
    {{- include "mta.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "mta.fullname" . }}-worker
  minReplicaCount: {{ .Values.worker.keda.minReplicaCount }}
  maxReplicaCount: {{ .Values.worker.keda.maxReplicaCount }}
  cooldownPeriod: 300
  triggers:
    - type: azure-servicebus
      metadata:
        namespace: {{ required "config.SERVICEBUS_NAMESPACE is required" .Values.config.SERVICEBUS_NAMESPACE | replace ".servicebus.windows.net" "" | quote }}
        queueName: {{ .Values.config.SERVICEBUS_QUEUE | quote }}
        messageCount: {{ .Values.worker.keda.messageCount | quote }}
      authenticationRef:
        name: {{ include "mta.fullname" . }}-worker-sb
{{- end }}
