apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sre.name" . }}-config
  labels:
    {{- include "sre.labels" . | nindent 4 }}
data:
  PORT: "3002"
  NODE_ENV: production
  WPF_SRE_LEARNING_STORE_PATH: /data/learning.json
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sre.serviceAccount" . }}
  labels:
    {{- include "sre.labels" . | nindent 4 }}
  {{- if .Values.serviceAccount.clientId }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.serviceAccount.clientId | quote }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
