{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mta.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "mta.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: '5'
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "mta.selector" (dict "root" . "component" "migrate") | nindent 8 }}
        azure.workload.identity/use: 'true'
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "mta.fullname" . }}-migrate
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "mta.image" . }}
          command: ['node', 'dist/database/migrate-cli.js']
          envFrom:
            {{- include "mta.envFrom" (dict "root" . "component" "migrate") | nindent 12 }}
          securityContext:
            {{- include "mta.containerSecurity" . | nindent 12 }}
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 250m, memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- include "mta.csiMount" . | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 32Mi }
        {{- include "mta.csiVolume" (dict "root" . "component" "migrate") | nindent 8 }}
{{- end }}
