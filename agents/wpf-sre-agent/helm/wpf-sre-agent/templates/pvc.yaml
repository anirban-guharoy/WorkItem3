apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "sre.name" . }}-data
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "sre.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.data.storageClassName }}
  storageClassName: {{ .Values.data.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.data.size }}
