# Do not commit real values. Create with:
#   kubectl -n manual-tester create secret generic manual-tester-secrets --from-env-file=.env
# Keys expected: WEBHOOK_SECRET, MCP_SERVER_URL, MCP_SERVER_TOKEN, AZURE_FOUNDRY_ENDPOINT, AZURE_FOUNDRY_API_KEY,
# XRAY_CLIENT_ID, XRAY_CLIENT_SECRET, LANGSMITH_API_KEY, ENTRA_TENANT_ID, ENTRA_API_AUDIENCE, DASHBOARD_ORIGIN,
# plus optional JIRA_BASE_URL, JIRA_EMAIL, JIRA_API_TOKEN, JIRA_AC_FIELD.
apiVersion: v1
kind: Secret
metadata:
  name: manual-tester-secrets
  namespace: manual-tester
type: Opaque
stringData:
  WEBHOOK_SECRET: change-me
  AZURE_FOUNDRY_ENDPOINT: https://<resource>.services.ai.azure.com/anthropic
  AZURE_FOUNDRY_API_KEY: ""
  MCP_SERVER_URL: https://mcp.example.com/mcp
  MCP_SERVER_TOKEN: ""
  XRAY_CLIENT_ID: ""
  XRAY_CLIENT_SECRET: ""
  ENTRA_TENANT_ID: ""
  ENTRA_API_AUDIENCE: ""
  DASHBOARD_ORIGIN: https://langsmith-ui.example.com
  LANGSMITH_TRACING: "true"
  LANGSMITH_API_KEY: ""
  LANGSMITH_ENDPOINT: https://api.smith.langchain.com
  LANGSMITH_PROJECT: manual-test-agent
