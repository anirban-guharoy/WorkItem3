# Create the runtime secret from the dashboard environment file:
# kubectl -n langsmith-ui create secret generic langsmith-ui-secrets \
#   --from-env-file=apps/langsmith-ui/.env
apiVersion: v1
kind: Secret
metadata:
  name: langsmith-ui-secrets
  namespace: langsmith-ui
type: Opaque
stringData:
  LANGSMITH_API_KEY: ""
