{{- range $name := list "api" "worker" "migrate" }}
{{- $cid := index $.Values.workloadIdentity $name "clientId" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mta.fullname" $ }}-{{ $name }}
  labels:
    {{- include "mta.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
  annotations:
    azure.workload.identity/client-id: {{ required (printf "workloadIdentity.%s.clientId is required" $name) $cid | quote }}
    azure.workload.identity/tenant-id: {{ required "keyVault.tenantId is required" $.Values.keyVault.tenantId | quote }}
{{- if eq $name "migrate" }}
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: '1'
    helm.sh/hook-delete-policy: before-hook-creation
{{- end }}
{{- if $.Values.keyVault.enabled }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "mta.fullname" $ }}-kv-{{ $name }}
  labels:
    {{- include "mta.labels" $ | nindent 4 }}
{{- if eq $name "migrate" }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: '1'
    helm.sh/hook-delete-policy: before-hook-creation
{{- end }}
spec:
  provider: azure
  parameters:
    usePodIdentity: 'false'
    clientID: {{ $cid | quote }}
    keyvaultName: {{ required "keyVault.name is required" $.Values.keyVault.name | quote }}
    tenantId: {{ required "keyVault.tenantId is required" $.Values.keyVault.tenantId | quote }}
    objects: |
      array:
        {{- range $k, $secret := $.Values.keyVault.secrets }}
        - |
          objectName: {{ $secret }}
          objectType: secret
          objectAlias: {{ $k }}
        {{- end }}
  secretObjects:
    - secretName: {{ include "mta.fullname" $ }}-{{ $name }}-secrets
      type: Opaque
      data:
        {{- range $k, $secret := $.Values.keyVault.secrets }}
        - objectName: {{ $k }}
          key: {{ $k }}
        {{- end }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mta.fullname" . }}
  labels:
    {{- include "mta.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.appEnv | quote }}
  NODE_ENV: production
  PORT: {{ .Values.api.port | quote }}
  WORKER_HEALTH_PORT: {{ .Values.worker.healthPort | quote }}
  {{- range $k, $v := .Values.config }}
  {{- if ne (toString $v) "" }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
