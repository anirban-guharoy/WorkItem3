{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mta.fullname" . }}-default-deny
  labels:
    {{- include "mta.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mta.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mta.fullname" . }}-api-ingress
  labels:
    {{- include "mta.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mta.selector" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports:
        - { port: {{ .Values.api.port }}, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mta.fullname" . }}-egress
  labels:
    {{- include "mta.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mta.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    {{- range .Values.networkPolicy.egress }}
    {{- if .cidr }}
    # {{ .name }}
    - to:
        - ipBlock:
            cidr: {{ .cidr | quote }}
      ports:
        - { port: {{ .port }}, protocol: TCP }
    {{- end }}
    {{- end }}
{{- end }}
